[package]
name = "magy-app"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.6", features = ["macros"] }
tokio = { version = "1.36", features = ["full"] }
tower-http = { version = "0.4", features = ["fs", "cors"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tao = "0.16"
wry = "0.24"
futures-util = "0.3"
async-stream = "0.3"
